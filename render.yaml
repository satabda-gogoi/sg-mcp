services:
  - type: web
    name: sg-mcp
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_TTS_MODEL
        value: gemini-3.8-flash-tts
      - key: DEFAULT_VOICE_ID
        value: charon
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_REFRESH_TOKEN
        sync: false
      - key: YOUTUBE_CHANNEL_EMAIL
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_CONFIG_ID
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_USER_ID
        sync: false
      - key: INSTAGRAM_AUTH_MODE
        value: unified
      - key: INSTAGRAM_GRAPH_VERSION
        value: v27.0
      - key: AUDIO_STORAGE_DIR
        value: /tmp/sg-mcp-audio
      - key: AUDIO_TTL_SECONDS
        value: "3600"
      - key: INCLUDE_INLINE_AUDIO
        value: "true"
      - key: MCP_AUTH_TOKEN
        sync: false
